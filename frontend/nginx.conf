# Minimal static-file server for the Vite build output, with API requests
# proxied to the backend container by its docker-compose service name
# ("backend" — see ../docker-compose.yml). Kept in sync with how the frontend
# resolves its API base URL at build time (see Dockerfile / src/api/client.ts):
# the frontend is built with VITE_API_BASE_URL=/api (a relative, same-origin
# path), so every request lands here first and this proxy forwards it on.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API — proxied to the `backend` compose service on its container
    # port (8000; see backend/Dockerfile and docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: let React Router-style client-side routes fall back to
    # index.html instead of 404ing on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
