name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # RUN_REAL_LLM_BENCHMARK / RUN_100M_BENCHMARK are deliberately left
      # unset: those suites are gated behind manual opt-in (real network calls
      # to a live LLM provider, and a 100M-row resource-heavy benchmark — see
      # backend/tests/benchmark/real_llm/runner.py and
      # backend/tests/test_large_data_100m.py). Plain `pytest -q` runs the
      # real, fast, deterministic suite only.
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # package.json's "build" script is `tsc -b && vite build`, so this
      # covers both the TypeScript typecheck and the production build.
      - name: Typecheck + build
        run: npm run build

      - name: Lint
        run: npm run lint
